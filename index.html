<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E7E4E2">
<meta name="color-scheme" content="light">
<title>Pizza & Fichi · Menù</title>
<meta name="description" content="Menù di Pizza & Fichi: pranzo, cena, pizze, bevande e dolci.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍕</text></svg>">
<link rel="preload" href="fonts/BC-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Newsreader.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Barlow Condensed";font-weight:500;font-display:swap;src:url(fonts/BC-Medium.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(fonts/BC-SemiBold.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/BC-Bold.woff2) format("woff2")}
@font-face{font-family:"Newsreader";font-weight:400 500;font-display:swap;src:url(fonts/Newsreader.woff2) format("woff2")}
@font-face{font-family:"Newsreader";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/Newsreader-Italic.woff2) format("woff2")}
:root{
  --bg:#E7E4E2; --paper:#F4F2F1; --ink:#2E2527; --muted:#6F6467; --line:#CBC3C1;
  --bordeaux:#7A1F33; --bordeaux-deep:#561424; --cream:#F7EFEA;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --text:"Newsreader",Georgia,"Times New Roman",serif;
  --w:600px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--bordeaux);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--w);margin:0 auto;padding:0 18px}

/* ---------- testata ---------- */
.brand{text-align:center;padding:30px 18px 6px;color:var(--bordeaux)}
.brand svg{width:min(250px,64vw);height:auto;display:block;margin:0 auto}
.brand img.logo-img{width:auto;max-width:min(260px,66vw);max-height:120px;height:auto;display:block;margin:0 auto}
.topbar .mini img.logo-img{max-height:40px;width:auto;max-width:100%;margin:0 auto}
.brand .slogan{font-family:var(--text);font-style:italic;color:var(--muted);font-size:16px;margin:4px 0 0;letter-spacing:.01em}

.topbar{position:sticky;top:0;z-index:20;background:rgba(231,228,226,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding-top:env(safe-area-inset-top,0px);margin-top:calc(-1 * env(safe-area-inset-top,0px));border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar .in{max-width:var(--w);margin:0 auto;height:58px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 10px}
.back{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-weight:600;font-size:18px;color:var(--bordeaux);text-decoration:none;padding:8px 8px;border-radius:8px;justify-self:start}
.back svg{width:20px;height:20px}
.topbar .mini{color:var(--bordeaux);width:104px;display:block}
.topbar .mini svg{width:100%;height:auto;display:block}

/* ---------- riquadri foto (home e ristorante) ---------- */
.choices{display:grid;gap:16px;padding:18px 0 8px}
.tile{position:relative;display:block;text-decoration:none;border-radius:6px;overflow:hidden;background:#d8d3d1;
  box-shadow:0 1px 0 rgba(46,37,39,.08),0 14px 30px -18px rgba(86,20,36,.55);aspect-ratio:4/3.1;isolation:isolate}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(40,8,16,.55) 100%);z-index:1}
.tile .label{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 18px 16px;color:#fff}
.tile .t{font-family:var(--display);font-weight:700;font-size:clamp(34px,10vw,46px);line-height:.92;letter-spacing:.005em;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.tile .s{display:block;font-family:var(--text);font-style:italic;font-weight:400;font-size:16px;letter-spacing:0;margin-top:6px;opacity:.95;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.tile .go{flex:none;width:46px;height:46px;border-radius:50%;background:var(--bordeaux);display:grid;place-items:center;box-shadow:0 6px 16px -6px rgba(0,0,0,.5)}
.tile .go svg{width:22px;height:22px;color:#fff}
.tile:active img{transform:scale(1.03)}
@media (hover:hover){.tile:hover img{transform:scale(1.04)}}

.home .tile{opacity:0;transform:translateY(14px);animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
.home .tile:nth-child(2){animation-delay:.12s}
.home .tile{aspect-ratio:4/2.85}
@keyframes rise{to{opacity:1;transform:none}}

.links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:18px 0 6px}
.pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:17px;color:var(--bordeaux);text-decoration:none;
  border:1.5px solid var(--bordeaux);border-radius:999px;padding:9px 16px;background:transparent}
.pill.solid{background:var(--bordeaux);color:#fff}
.pill svg{width:18px;height:18px}

/* ---------- pagina menù ---------- */
.hero{position:relative;max-width:var(--w);margin:0 auto;height:min(46vw,250px);min-height:180px;overflow:hidden;border-radius:0 0 6px 6px}
.hero img{width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(40,8,16,.62) 100%)}
.hero .cap{position:absolute;left:18px;right:18px;bottom:16px;z-index:1;color:#fff}
.hero h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(40px,12vw,56px);line-height:.9;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.hero p{margin:6px 0 0;font-style:italic;font-size:17px;text-shadow:0 1px 8px rgba(0,0,0,.45)}

.tabs{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:15;background:rgba(231,228,226,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tabs .in{max-width:var(--w);margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:10px 18px;scrollbar-width:none}
.tabs .in::-webkit-scrollbar{display:none}
.tabs a{flex:none;font-family:var(--display);font-weight:600;font-size:17px;text-decoration:none;color:var(--muted);padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--paper)}
.tabs a.on{color:#fff;background:var(--bordeaux);border-color:var(--bordeaux)}

.menu{padding-top:8px;padding-bottom:10px}
.sec{padding:26px 0 6px}
.sec-h{display:flex;align-items:baseline;justify-content:center;gap:12px;margin:0 0 6px;color:var(--bordeaux)}
.sec-h h2{margin:0;font-family:var(--display);font-weight:700;font-size:34px;line-height:1;letter-spacing:.01em}
.sec-h::before,.sec-h::after{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;transform:translateY(-8px);opacity:.75}
.sec-sub{text-align:center;color:var(--muted);font-style:italic;margin:0 0 8px;font-size:16px}
.sec-sub b{font-family:var(--display);font-style:normal;font-weight:600;color:var(--bordeaux);font-size:19px}
.grp{font-family:var(--display);font-weight:600;font-size:22px;color:var(--ink);margin:22px 0 2px;padding-bottom:4px;border-bottom:1.5px solid var(--bordeaux)}

.items{list-style:none;margin:0;padding:0}
.item{padding:14px 0;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.item:last-child{border-bottom:0}
.item.compact{padding:10px 0}
.name small{font-family:var(--text);font-weight:400;font-size:15px;color:var(--muted);white-space:nowrap}
.item .body{flex:1;min-width:0}
.row{display:flex;align-items:baseline;gap:8px}
.name{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.15;color:var(--ink)}
.dots{flex:1;min-width:16px;border-bottom:2px dotted #a99ea0;transform:translateY(-5px)}
.price{font-family:var(--display);font-weight:600;font-size:20px;color:var(--bordeaux);white-space:nowrap}
.desc{margin:3px 0 0;color:var(--muted);font-size:16px;line-height:1.45}
.alg{margin:6px 0 0;display:flex;flex-wrap:wrap;gap:5px}
.alg span{font-family:var(--display);font-weight:500;font-size:14px;line-height:1;color:var(--bordeaux);background:rgba(122,31,51,.08);border-radius:999px;padding:4px 9px}
.thumb{flex:none;width:84px;height:84px;border-radius:6px;object-fit:cover;background:#d8d3d1}

.offer{margin:30px 0 6px;background:var(--bordeaux);color:var(--cream);border-radius:6px;padding:22px 20px 20px;position:relative;overflow:hidden}
.offer::before{content:"";position:absolute;inset:7px;border:1px solid rgba(247,239,234,.35);border-radius:3px;pointer-events:none}
.offer h3{margin:0;font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;color:#fff}
.offer .inc{margin:8px 0 0;font-size:17px}
.offer .big{font-family:var(--display);font-weight:700;font-size:54px;line-height:1;margin:12px 0 0;color:#fff}
.offer .note{margin:12px 0 0;font-size:14.5px;line-height:1.45;opacity:.88;font-style:italic}

.foot{max-width:var(--w);margin:26px auto 0;padding:22px 18px 34px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:15px}
.foot p{margin:0 0 10px}
.foot .addr{font-family:var(--display);font-weight:600;font-size:17px;color:var(--ink)}
.foot a{color:var(--bordeaux)}

.algtable{list-style:none;margin:12px 0 0;padding:0}
.algtable li{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.algtable .n{width:36px;height:36px;border-radius:50%;background:var(--bordeaux);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px}
.algtable b{font-family:var(--display);font-weight:600;font-size:21px;display:block;line-height:1.2}
.algtable span{color:var(--muted);font-size:15.5px}
.intro{color:var(--muted);font-style:italic;text-align:center;margin:20px 0 0}

.empty{text-align:center;color:var(--muted);font-style:italic;padding:30px 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .home .tile{opacity:1;transform:none}
}
@media (min-width:700px){
  .choices.two{grid-template-columns:1fr 1fr}
  .choices.two .tile{aspect-ratio:3/3.6}
}
</style>
</head>
